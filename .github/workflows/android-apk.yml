name: Android APK (debug)

# Сборка отладочного APK: web-бандл (Capacitor) → Gradle assembleDebug.
# Запускается на push в рабочую ветку или вручную (Actions → Run workflow).
# Артефакты: kumushay-debug-apk (готовый APK) и build-log (весь вывод сборки).

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Environment info
        run: |
          {
            echo "=== java ==="; java -version
            echo "=== ANDROID_HOME=${ANDROID_HOME:-<empty>} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<empty>} ==="
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            echo "=== sdk dir: $SDK ==="; ls "$SDK" 2>&1
            echo "=== platforms ==="; ls "$SDK/platforms" 2>&1
            echo "=== build-tools ==="; ls "$SDK/build-tools" 2>&1
            echo "=== node/bun ==="; node -v; bun -v
          } 2>&1 | tee build.log

      - name: Ensure Android SDK packages
        run: |
          set -o pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK/platforms/android-35" ]; then
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>&1 | tail -20 | tee -a build.log
          else
            echo "android-35 уже установлен" | tee -a build.log
          fi
          echo "sdk.dir=$SDK" > android/local.properties
          cat android/local.properties | tee -a build.log

      - name: Install JS dependencies
        run: bun install --frozen-lockfile 2>&1 | tee -a build.log

      - name: Build web bundle (mobile)
        run: bun run mobile:web 2>&1 | tee -a build.log

      - name: Verify web bundle has offline fixes
        run: |
          set -e
          grep -rq "Сохранено локально" mobile/www/assets/*.js
          grep -rq "Пропустить неудачные" mobile/www/assets/*.js
          echo "офлайн-код присутствует в бандле" | tee -a build.log

      - name: Capacitor sync (android)
        run: bunx cap sync android 2>&1 | tee -a build.log

      - name: Build debug APK
        run: sh android/gradlew -p android assembleDebug --no-daemon --stacktrace 2>&1 | tee -a build.log

      - name: Verify APK contents
        run: |
          set -o pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          unzip -l "$APK" | grep -q "assets/public/assets/index-"
          unzip -p "$APK" assets/public/assets/index-*.js | grep -q "Сохранено локально"
          ls -la android/app/build/outputs/apk/debug/ | tee -a build.log
          sha256sum "$APK" | tee -a build.log

      - name: Publish APK (tag apk-latest + release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p /tmp/apkpub && cp "$APK" /tmp/apkpub/kumushay-debug.apk
          cd /tmp/apkpub
          git init -q
          git add kumushay-debug.apk
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -q -m "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/tags/apk-latest
          cd "$GITHUB_WORKSPACE"
          gh release view apk-latest > /dev/null 2>&1 \
            && gh release upload apk-latest "$APK" --clobber \
            || gh release create apk-latest "$APK" --title "Kumush_ay APK" --notes "Отладочная сборка из ветки ${GITHUB_REF_NAME}, коммит ${GITHUB_SHA::7}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kumushay-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
