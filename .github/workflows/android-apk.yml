name: Android APK (debug)

# Сборка отладочного APK: web-бандл (Capacitor) → Gradle assembleDebug.
# Запускается на push в рабочую ветку или вручную (Actions → Run workflow).
# Артефакты: kumushay-debug-apk (готовый APK) и build-log (весь вывод сборки).

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Environment info
        run: |
          {
            echo "=== java ==="; java -version
            echo "=== ANDROID_HOME=${ANDROID_HOME:-<empty>} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<empty>} ==="
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            echo "=== sdk dir: $SDK ==="; ls "$SDK" 2>&1
            echo "=== platforms ==="; ls "$SDK/platforms" 2>&1
            echo "=== build-tools ==="; ls "$SDK/build-tools" 2>&1
            echo "=== node/bun ==="; node -v; bun -v
          } 2>&1 | tee build.log

      - name: Ensure Android SDK packages
        run: |
          set -o pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK/platforms/android-35" ]; then
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>&1 | tail -20 | tee -a build.log
          else
            echo "android-35 уже установлен" | tee -a build.log
          fi
          echo "sdk.dir=$SDK" > android/local.properties
          cat android/local.properties | tee -a build.log

      - name: Install JS dependencies
        run: bun install --frozen-lockfile 2>&1 | tee -a build.log

      - name: Build web bundle (mobile)
        run: bun run mobile:web 2>&1 | tee -a build.log

      - name: Capacitor sync (android)
        run: bunx cap sync android 2>&1 | tee -a build.log

      - name: Build debug APK
        run: sh android/gradlew -p android assembleDebug --no-daemon --stacktrace 2>&1 | tee -a build.log

      - name: Show APK
        if: always()
        run: ls -la android/app/build/outputs/apk/debug/ 2>&1 | tee -a build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kumushay-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
